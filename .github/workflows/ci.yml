name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  accounts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated account tests
        run: python -m unittest discover -s tests -p test_codex_accounts.py -v

  sessions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Session handoff and credential tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax and lint
        run: |
          for script in cs cx codex-cs; do bash -n "$script"; done
          shellcheck --severity=warning cs cx codex-cs
      - name: Launcher smoke tests
        run: |
          ./cs --help
          ./cx help
          ./cx install
          "$HOME/.local/bin/cx" help

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse and install launcher
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\cx.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          .\cx.ps1 install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:LOCALAPPDATA\codex-accounts\bin\cx.cmd" help
          exit $LASTEXITCODE
