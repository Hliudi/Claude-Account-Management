name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  codex:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Codex account switching (synthetic credentials only)
        run: python -m unittest discover -s tests -v

  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: bash -n ca && bash -n cx
      - name: shellcheck
        run: shellcheck --severity=warning ca cx
      - name: smoke test
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/bin" && printf '#!/bin/bash\necho ok\n' > "$HOME/bin/claude"
          chmod +x "$HOME/bin/claude"
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"   # the rc line ca writes is not read here
          ./ca install < /dev/null
          echo sk-ant-oat01-testtoken | ca add work
          ca ls | grep -q work
          ca use work && ca ls | grep -q '^\*'
          ca vscode > /dev/null && "$HOME/.local/bin/ca-vscode-wrapper" env | grep -q CLAUDE_CODE_OAUTH_TOKEN
          ca rm work

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse
        shell: powershell
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\ca-win.ps1", [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: install and add
        shell: powershell
        run: |
          .\ca-win.ps1 install
          "sk-ant-oat01-testtoken" | .\ca-win.ps1 add work
          .\ca-win.ps1 ls
          .\ca-win.ps1 use work
          .\ca-win.ps1 rm work
